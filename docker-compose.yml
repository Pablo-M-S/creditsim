services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: creditsim
      POSTGRES_USER: creditsim
      POSTGRES_PASSWORD: creditsim_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditsim -d creditsim"]
      interval: 5s
      timeout: 5s
      retries: 10

  strapi:
    build: ./app
    restart: unless-stopped
    env_file: ./app/.env
    environment:
      HOST: 0.0.0.0
      PORT: 7870
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: creditsim
      DATABASE_USERNAME: creditsim
      DATABASE_PASSWORD: creditsim_pass
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    ports:
      - "7870:7870"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # URL publica do backend (o navegador chama direto). Definir em ~/creditsim/.env
        VITE_API_URL: ${VITE_API_URL:-http://localhost:7870}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - strapi

volumes:
  postgres_data:
  strapi_uploads:
